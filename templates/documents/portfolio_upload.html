{% extends 'base.html' %}
{% load static %}

{% block title %}Yangi Portfolio Qo'shish{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto py-8 px-4 sm:px-6 lg:px-8">
    <div class="mb-6 flex items-center justify-between">
        <div>
            <h1 class="text-2xl font-bold text-gray-900">Portfolio qismini yuklash</h1>
            <p class="mt-1 text-sm text-gray-500">Bog'langan hujjat: {{ document.title }}</p>
        </div>
        <a href="{% url 'documents:detail' document.id %}" class="text-primary hover:text-zinc-950 text-sm font-medium">
            &larr; Orqaga
        </a>
    </div>

    <div class="bg-white shadow sm:rounded-lg overflow-hidden border border-gray-200">
        <form method="POST" enctype="multipart/form-data" class="p-6">
            {% csrf_token %}
            
            <div class="space-y-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Asar yoki Loyiha nomi *</label>
                    <input type="text" name="title" required class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-primary focus:border-primary sm:text-sm">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">Muhit yoki Material (Medium)</label>
                    <input type="text" name="medium" placeholder="Masalan: Akril, Raqamli dizayn, 3D render" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-primary focus:border-primary sm:text-sm">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700">G'oya tavsifi (Konsepsiya)</label>
                    <textarea name="description" rows="4" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-primary focus:border-primary sm:text-sm" placeholder="Ushbu asarda qanday qadriyat yoki xabar yashiringan?"></textarea>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">Asar fayli (Rasm / PDF) *</label>
                    <div class="mt-1 flex justify-center px-6 pt-5 pb-6 border-2 border-gray-300 border-dashed rounded-md">
                        <div class="space-y-1 text-center">
                            <i data-lucide="image" class="mx-auto h-12 w-12 text-gray-400"></i>
                            <div class="flex text-sm text-gray-600">
                                <label class="relative cursor-pointer bg-white rounded-md font-medium text-primary hover:text-indigo-500 focus-within:outline-none focus-within:ring-2 focus-within:ring-offset-2 focus-within:ring-primary">
                                    <span>Faylni tanlang</span>
                                    <input name="file" type="file" accept="image/*,application/pdf" class="sr-only" required>
                                </label>
                            </div>
                            <p class="text-xs text-gray-500">PNG, JPG, WEBP yoki PDF (Max 10MB)</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="mt-6">
                <button type="submit" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-primary hover:bg-zinc-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary">
                    Yuklash va Saqlash
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
