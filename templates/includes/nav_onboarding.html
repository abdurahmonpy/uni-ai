{% load static %}
<!-- Minimal Clean Header for Onboarding -->
<header class="bg-white border-b border-slate-200 py-3.5 px-4 sm:px-8">
  <div class="max-w-4xl mx-auto flex items-center justify-between">
    <!-- Brand Logo -->
    <a href="{% url 'home' %}" class="flex items-center space-x-2.5">
      <div class="w-8 h-8 rounded-xl bg-white border border-slate-200 overflow-hidden flex items-center justify-center p-0.5 shadow-xs">
        <img src="{% static 'images/unimentor_logo.png' %}" alt="UniMentor" class="w-full h-full object-contain">
      </div>
      <span class="text-lg font-black text-slate-900 tracking-tight">UniMentor</span>
      <span class="text-[9px] font-black uppercase px-1 py-0.5 rounded bg-zinc-950 text-white shadow-xs">AI</span>
    </a>

    <!-- User and Logout -->
    <div class="flex items-center space-x-3">
      <span class="text-xs text-slate-500 font-medium hidden sm:inline">
        {{ request.user.first_name|default:request.user.phone_number }}
      </span>
      <form method="post" action="{% url 'accounts:logout' %}" class="inline">
        {% csrf_token %}
        <button type="submit" class="text-xs text-slate-500 hover:text-red-600 px-3 py-1.5 rounded-lg hover:bg-red-50 transition flex items-center space-x-1 border border-slate-200" title="Chiqish">
          <i data-lucide="log-out" class="w-3.5 h-3.5"></i>
          <span>Chiqish</span>
        </button>
      </form>
    </div>
  </div>
</header>
